<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background:#f4f4f7; padding:24px;">
<div style="max-width:480px; margin:0 auto; background:#fff; border-radius:8px; padding:32px;">
    <h2 style="color:#1e293b;">Hi <span th:text="${name}">User</span>,</h2>
    <p style="color:#334155; font-size:15px;">
        We received a request to set/reset the password for your account.
        Click the button below to continue. This link will expire in
        <span th:text="${expiryMinutes}">30</span> minutes.
    </p>
    <p style="text-align:center; margin:32px 0;">
        <a th:href="${resetLink}"
           style="background:#4f46e5; color:#fff; padding:12px 24px; border-radius:6px; text-decoration:none; font-weight:600;">
            Set Password
        </a>
    </p>
    <p style="color:#94a3b8; font-size:13px;">
        If you didn't request this, you can safely ignore this email.
    </p>
</div>
</body>
</html>
