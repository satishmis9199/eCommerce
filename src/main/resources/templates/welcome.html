<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; background:#f4f4f7; padding:20px;">
<div style="max-width:500px;margin:auto;background:#fff;border-radius:8px;padding:30px;">
    <h2 style="color:#333;">Welcome aboard, <span th:text="${name}">User</span>! 🚀</h2>
    <p style="color:#555;">
        Thanks for signing up! Your account is all set and ready to go.
    </p>
    <a th:href="${loginLink}"
       style="display:inline-block;padding:12px 24px;background:#4f46e5;color:#fff;
              text-decoration:none;border-radius:6px;margin-top:15px;">
        Get Started
    </a>
    <p style="color:#999;font-size:13px;margin-top:25px;">
        Need help? Reach us at <span th:text="${supportEmail}">support@yourapp.com</span>
    </p>
</div>
</body>
</html>
