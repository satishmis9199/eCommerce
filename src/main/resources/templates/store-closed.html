<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Store Closed</title>
  <style>
    :root{--theme:#5b0135;--bg:#faf7f9;--card:#fff;--text:#1f1a1d;--muted:#6b6268}
    @media(prefers-color-scheme:dark){:root{--bg:#141013;--card:#1e181c;--text:#f3edf0;--muted:#a79ca2}}
    *{box-sizing:border-box;margin:0}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;position:relative;overflow:hidden}
    body::before{content:"";position:fixed;inset:-25% auto auto -15%;width:460px;height:460px;border-radius:50%;background:var(--theme);opacity:.12;filter:blur(60px)}
    body::after{content:"";position:fixed;inset:auto -15% -25% auto;width:460px;height:460px;border-radius:50%;background:var(--theme);opacity:.10;filter:blur(60px)}
    .wrap{position:relative;z-index:1;width:100%;max-width:480px;text-align:center}
    .sign{width:230px;margin:0 auto;position:relative;padding-top:58px;transform-origin:top center;animation:swing 3.5s ease-in-out infinite}
    @keyframes swing{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-3deg)}}
    .sign::before,.sign::after{content:"";position:absolute;top:0;width:2px;height:58px;background:var(--muted);opacity:.6}
    .sign::before{left:50px;transform:rotate(12deg);transform-origin:top}
    .sign::after{right:50px;transform:rotate(-12deg);transform-origin:top}
    .board{background:var(--theme);color:#fff;border-radius:14px;padding:18px 12px;box-shadow:0 12px 30px rgba(0,0,0,.25);border:3px solid rgba(255,255,255,.25)}
    .board small{display:block;font-size:12px;letter-spacing:2px;opacity:.85}
    .board b{display:block;font-size:34px;letter-spacing:3px;margin-top:4px}
    .card{background:var(--card);border-radius:24px;padding:32px 26px 28px;margin-top:-6px;box-shadow:0 20px 60px rgba(0,0,0,.12)}
    .logo{width:72px;height:72px;border-radius:18px;object-fit:cover;margin:0 auto 10px;display:block;border:1px solid rgba(128,128,128,.2)}
    .logo-fallback{width:72px;height:72px;border-radius:18px;margin:0 auto 10px;background:var(--theme);color:#fff;font-size:30px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .store{font-size:15px;font-weight:600;color:var(--muted)}
    h1{font-size:24px;margin:16px 0 10px}
    p.msg{color:var(--muted);line-height:1.6;font-size:15px}
    .contact{margin-top:24px;padding-top:22px;border-top:1px dashed rgba(128,128,128,.3)}
    .contact h2{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:14px}
    .btns{display:flex;flex-direction:column;gap:10px}
    .btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px 16px;border-radius:12px;font-size:15px;font-weight:600;text-decoration:none;transition:transform .15s}
    .btn:hover{transform:translateY(-2px)}
    .btn.wa{background:#25d366;color:#fff}
    .btn.call{background:var(--theme);color:#fff}
    .btn.mail{border:1.5px solid var(--theme);color:var(--theme)}
    .btn svg{width:18px;height:18px}
    .hide{display:none}
    .loader{color:var(--muted);padding:40px 0}
    footer{margin-top:20px;font-size:12px;color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">
  <div class="loader" id="loader">Loading…</div>
  <div id="content" class="hide">
    <div class="sign"><div class="board"><small>SORRY, WE'RE</small><b>CLOSED</b></div></div>
    <main class="card">
      <div id="logoWrap"></div>
      <div class="store" id="storeName"></div>
      <h1>We're Currently Closed</h1>
      <p class="msg">This store is closed for now and is not accepting orders at the moment. Please visit again soon, or reach out to the store for more information.</p>
      <div class="contact" id="contact">
        <h2>Need help? Get in touch</h2>
        <div class="btns" id="btns"></div>
      </div>
      <footer id="foot"></footer>
    </main>
  </div>
</div>

<script>
  // Base path where uploaded files (logo/, favicon/) are served from — adjust to your setup
  const FILE_BASE = "/";
  const API_URL = "/api/u1/v1/store/info";

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const svg = {
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 3.5A11.8 11.8 0 0 0 12 0C5.4 0 0 5.4 0 12c0 2.1.6 4.2 1.6 6L0 24l6.2-1.6A12 12 0 0 0 12 24c6.6 0 12-5.4 12-12 0-3.2-1.2-6.2-3.5-8.5zM12 22a10 10 0 0 1-5.1-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A10 10 0 1 1 12 22z"/></svg>',
    call:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>'
  };

  function render(d){
    const name = d.businessName || d.storeName || "Store";
    document.title = name + " — Closed";
    if (d.themeColor) document.documentElement.style.setProperty("--theme", d.themeColor);
    if (d.faviconUrl){
      let l = document.querySelector("link[rel=icon]") || document.head.appendChild(Object.assign(document.createElement("link"),{rel:"icon"}));
      l.href = FILE_BASE + d.faviconUrl;
    }
    $("logoWrap").innerHTML = d.logoUrl
      ? `<img class="logo" src="${esc(FILE_BASE + d.logoUrl)}" alt="${esc(name)}" onerror="this.outerHTML='<div class=logo-fallback>${esc(name[0]||"S")}</div>'">`
      : `<div class="logo-fallback">${esc(name[0]||"S")}</div>`;
    $("storeName").textContent = name;

    const wa = (d.whatsapp || "").replace(/\D/g, "");
    let b = "";
    if (wa) b += `<a class="btn wa" href="https://wa.me/${wa.length===10?"91"+wa:wa}" target="_blank" rel="noopener">${svg.wa} WhatsApp</a>`;
    if (d.supportPhone) b += `<a class="btn call" href="tel:${esc(d.supportPhone)}">${svg.call} ${esc(d.supportPhone)}</a>`;
    if (d.supportEmail) b += `<a class="btn mail" href="mailto:${esc(d.supportEmail)}">${svg.mail} ${esc(d.supportEmail)}</a>`;
    if (b) $("btns").innerHTML = b; else $("contact").classList.add("hide");
    $("foot").textContent = "© " + new Date().getFullYear() + " " + name;
    $("loader").classList.add("hide");
    $("content").classList.remove("hide");
  }

  fetch(API_URL, {headers:{Accept:"application/json"}})
    .then(r => r.json())
    .then(d => {
      if (d.storeStatus && d.storeStatus !== "CLOSED") { location.href = "/"; return; }
      render(d);
    })
    .catch(() => { $("loader").textContent = "Unable to load store information."; });
</script>
</body>
</html>
