server.port=8080

# ============================================================
# DATABASE
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# ============================================================
# ERROR HANDLING
# ============================================================

server.error.whitelabel.enabled=false


# ============================================================
# SUPER ADMIN
# ============================================================

app.super-admin-domain=${SUPER_ADMIN_DOMAIN}


# ============================================================
# CLOUDFLARE R2
# ============================================================

cloudflare.r2.bucket=${R2_BUCKET}
cloudflare.r2.endpoint=${R2_ENDPOINT}
cloudflare.r2.public-url=${R2_PUBLIC_URL}
cloudflare.r2.access-key=${R2_ACCESS_KEY}
cloudflare.r2.secret-key=${R2_SECRET_KEY}


# ============================================================
# FILE UPLOAD
# ============================================================

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB


# ============================================================
# EMAIL
# ============================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}


# ============================================================
# GEMINI / SPRING AI
# ============================================================

spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.6-flash
spring.ai.google.genai.chat.options.temperature=0.4